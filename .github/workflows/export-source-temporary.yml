name: Export source temporary

on:
  push:
    branches:
      - feat/per-level-card-rewards
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install dependencies
        run: npm install
      - name: Pack workspace
        run: tar --exclude=.git -czf /tmp/cicg-workspace.tgz .
      - name: Upload workspace archive
        uses: actions/upload-artifact@v4
        with:
          name: cicg-workspace
          path: /tmp/cicg-workspace.tgz
          if-no-files-found: error
          retention-days: 1
