name: Apply duplicate upgrade bundle temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/duplicate-card-upgrades
          fetch-depth: 0
      - name: Apply bundle
        run: |
          cat .github/upgrade-bundle.part* | base64 --decode > /tmp/upgrade.tgz
          tar -xzf /tmp/upgrade.tgz
          rm -f .github/upgrade-bundle.part*
          rm -f .github/workflows/apply-duplicate-upgrade-bundle-temporary.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement duplicate card upgrades"
          git push origin HEAD:feat/duplicate-card-upgrades
